<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>

        body{
            display: flex;
            border: 8px solid black;
            justify-content: flex-start;
        }
        .box{
            height: 200px;
            width: 200px;
            background-color: blue;
            font-size: 40pt;
        }
    </style>
</head>
<body>
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    
</body>
</html>
