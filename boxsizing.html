<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing </title>
    <style>
        *{
            margin: 0;
            /* box-sizing: border-box; */
        }

        .continer1, .continer2{
            background-color: aqua;
            width: 400px;
            height: 100px;
            border: 5px solid green;
            margin: 10px;
            padding: 10px;
            /* box-sizing: border-box; */
        }
        .continer1{
            box-sizing: content-box;
        }
        .continer2{
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="continer1">
        <h1>Front End Cource</h1>
    </div>

    <div class="continer2">
        <h1>Full Stack Cource</h1>
    </div>
    
</body>
</html>
